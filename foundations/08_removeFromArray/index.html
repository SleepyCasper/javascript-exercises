<!DOCTYPE html>
<html lang="en">
<head>

</head>
<body>
    <script>
       const sumAll = function(start, end) {
           let sum = 0;
           let length = (end - start) + 2; //4
           for (let number = start; number < length; number++) {
               sum += number; // 3
           }

           return sum;
       };

       console.log(sumAll(2, 4));
    </script>
</body>
</html>
